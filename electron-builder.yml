appId: com.abir.english-learning-companion
productName: English Learning Companion
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!tests/*'
  - '!electron.vite.config.*'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,vitest.config.ts}'
  - '!{SETUP.md,README.md}'
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
npmRebuild: false
