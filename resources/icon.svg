<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- English Learning Companion: a speech bubble ("En") with a subtitle bar and a spark of learning. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8405f"/>
      <stop offset="0.55" stop-color="#781b36"/>
      <stop offset="1" stop-color="#4c0e21"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8e9ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2a0611" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bg)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#shine)"/>
  <path filter="url(#shadow)" fill="url(#bubble)"
        d="M 270 236 H 754 A 118 118 0 0 1 872 354 V 612 A 118 118 0 0 1 754 730 H 456 L 314 846 L 336 730 H 270 A 118 118 0 0 1 152 612 V 354 A 118 118 0 0 1 270 236 Z"/>
  <text x="512" y="578" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="800" font-size="292" letter-spacing="-6" fill="#781b36">En</text>
  <rect x="352" y="622" width="320" height="30" rx="15" fill="#d94b74"/>
  <path fill="#ffcf6e" d="M 822 128 Q 835 211 918 224 Q 835 237 822 320 Q 809 237 726 224 Q 809 211 822 128 Z"/>
</svg>
